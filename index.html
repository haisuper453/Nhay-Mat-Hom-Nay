<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff1f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mắt Nháy"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"><title>Mắt Nháy Hôm Nay</title></head><body><main class="app"><header><div class="flower">✿</div><h1>Mắt Nháy Hôm Nay</h1><p>Một chút may mắn dành riêng cho em ♡</p></header><nav><button class="tab active" data-tab="home">♡ Xem điềm</button><button class="tab" data-tab="history">◷ Lịch sử</button><button class="tab" data-tab="settings">⚙ Cài đặt</button></nav><section id="home" class="page active"><div class="card"><label>Mắt nào vừa giật?</label><div class="eyes"><button class="eye selected" data-eye="left">👁<span>Mắt trái</span></button><button class="eye" data-eye="right">👁<span>Mắt phải</span></button></div><label for="time">Thời gian mắt giật</label><div class="time-row"><input id="time" type="time" value="10:00"><button id="now" class="secondary">Bây giờ</button></div><label for="gender">Giới tính</label><select id="gender"><option value="female">Nữ</option><option value="male">Nam</option></select><button id="reveal" class="primary">✨ Xem điềm báo</button></div><div id="result" class="card result" hidden aria-live="polite"></div></section><section id="history" class="page"><div class="card"><div class="heading"><h2>Lịch sử của em ♡</h2><button id="clear" class="text-button">Xóa tất cả</button></div><div id="history-list"></div></div></section><section id="settings" class="page"><div class="card"><h2>Cài đặt</h2><p>Giới tính mặc định được lưu trên điện thoại này.</p><label for="default-gender">Giới tính mặc định</label><select id="default-gender"><option value="female">Nữ</option><option value="male">Nam</option></select><p class="hint">Dữ liệu điềm báo được lưu sẵn trong ứng dụng. Lịch sử chỉ được lưu trên thiết bị này.</p></div></section><footer>Made with ♡ · Chỉ mang tính chất giải trí</footer></main><script src="app.js" defer></script></body></html>
